# tmux do terminal web: toda janela abre o claude (nunca um prompt de shell).
# O usuário `estudo` tem shell nologin; o bash aqui só executa o claude.
set -g default-shell /bin/bash
set -g default-command "exec claude"
set -g status off
set -g mouse on
set -g history-limit 20000
set -g escape-time 10
